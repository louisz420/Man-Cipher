<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Z1MCIPHOR</title>
<style>
  :root{
    --bg:#050a14;
    --bg2:#02060d;
    --fg:#4db8ff;
    --fg-dim:#1a5580;
    --fg-bright:#aaddff;
    --line:#0f3050;
    --line-bright:#1a5f96;
    --err:#ff4466;
    --glow:0 0 4px rgba(77,184,255,.6), 0 0 12px rgba(77,184,255,.25);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:0;
    min-height:100vh;
    display:flex;flex-direction:column;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0) 4px
      ),
      radial-gradient(ellipse at 50% -10%, #0a1830 0%, var(--bg) 45%, var(--bg2) 100%);
    color:var(--fg);
    font-family:"IBM Plex Mono","JetBrains Mono","Fira Code",
                ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;line-height:1.4;
    text-shadow:var(--glow);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(77,184,255,0.03) 0px,
      rgba(77,184,255,0.03) 1px,
      transparent 1px,transparent 3px);
    z-index:1;
  }
  body > *{position:relative;z-index:2}

  .menubar{
    display:flex;align-items:center;gap:4px;
    padding:4px 8px;
    border-bottom:1px solid var(--line);
    background:rgba(10,25,45,0.9);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    user-select:none;
    position:relative;
    z-index:40;
  }
  .menubar .brand{
    color:var(--fg-bright);
    font-weight:700;
    letter-spacing:.18em;
    margin-right:12px;
    padding:2px 4px;
    text-shadow:var(--glow);
  }
  .menubar .menu{position:relative}
  .menubar .menu > button{
    font:inherit;
    background:transparent;border:none;
    color:var(--fg-dim);
    padding:4px 10px;
    cursor:pointer;
    letter-spacing:.12em;
    text-transform:uppercase;
    border-radius:3px;
    transition:.12s;
  }
  .menubar .menu > button:hover,
  .menubar .menu.open > button{
    color:var(--fg);
    background:rgba(77,184,255,.1);
  }
  .dropdown{
    display:none;
    position:absolute;
    top:100%;left:0;
    min-width:180px;
    background:rgba(8,20,36,0.98);
    border:1px solid var(--line-bright);
    box-shadow:0 0 24px rgba(77,184,255,.2);
    padding:4px 0;
    z-index:50;
  }
  .menubar .menu.open .dropdown{display:block}
  .dropdown button{
    display:block;
    width:100%;
    text-align:left;
    font:inherit;
    background:transparent;border:none;
    color:var(--fg-dim);
    padding:7px 14px;
    cursor:pointer;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-size:11px;
    transition:.12s;
  }
  .dropdown button:hover{
    background:rgba(77,184,255,.12);
    color:var(--fg-bright);
  }
  .dropdown .sep{
    height:1px;
    background:var(--line);
    margin:4px 0;
  }

  #clock{
    margin-left:auto;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--fg-dim);
    text-transform:uppercase;
    user-select:none;
    padding-right:4px;
  }
  #clock .t{
    color:var(--fg-bright);
    text-shadow:var(--glow);
  }

  .main-wrap{
    flex:1;
    max-width:960px;width:100%;
    margin:0 auto;
    padding:14px 14px 16px;
    display:flex;flex-direction:column;
  }
  .main-wrap.minimized{display:none}

  .header{text-align:center;margin-bottom:12px}
  .header h1{
    margin:0;
    font-size:clamp(14px,2.8vw,18px);
    letter-spacing:.24em;font-weight:700;
    color:var(--fg);
    text-shadow:var(--glow),0 0 18px rgba(77,184,255,0.5);
    text-transform:uppercase;
  }
  .header .sub{
    margin:3px 0 0;font-size:10px;color:var(--fg-dim);
    letter-spacing:.14em;text-transform:uppercase;
  }

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.cols{grid-template-columns:1fr}}

  .panel{
    border:1px solid var(--line-bright);
    background:rgba(3,10,20,0.85);
    padding:0;
    display:flex;flex-direction:column;
    box-shadow:
      0 0 0 1px rgba(77,184,255,0.08) inset,
      0 0 24px rgba(77,184,255,0.06);
  }
  .panel .ptitle{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 12px;
    border-bottom:1px solid var(--line);
    background:rgba(15,40,70,0.6);
    font-size:10px;color:var(--fg-dim);
    letter-spacing:.18em;text-transform:uppercase;
  }
  .panel .ptitle .tag{
    color:var(--fg-dim);font-size:9px;
    letter-spacing:.14em;opacity:.7;
  }
  .panel .ptitle .tag.out{color:var(--fg-bright);opacity:1}
  .panel .pbody{padding:10px;display:flex;flex-direction:column;gap:8px}

  textarea{
    width:100%;min-height:150px;resize:vertical;
    background:#020610;
    border:1px solid var(--line);
    color:var(--fg);
    font:inherit;padding:10px;
    outline:none;
    caret-color:var(--fg);
    text-shadow:var(--glow);
    letter-spacing:.02em;
    transition:border-color .15s,box-shadow .15s,color .15s;
    word-break:break-all;
  }
  textarea:focus{
    border-color:var(--fg);
    box-shadow:0 0 0 1px rgba(77,184,255,.3),0 0 14px rgba(77,184,255,.15) inset;
  }
  textarea.out{color:var(--fg-bright);border-color:var(--line-bright)}
  textarea::placeholder{color:var(--fg-dim);text-shadow:none}

  .btnrow{display:flex;gap:6px}
  .btn{
    flex:1;
    display:block;
    font:inherit;cursor:pointer;
    background:transparent;
    color:var(--fg);
    border:1px solid var(--line-bright);
    padding:8px 10px;
    text-align:center;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-size:11px;
    text-shadow:var(--glow);
    transition:.15s;
  }
  .btn::before{content:"[ "}
  .btn::after{content:" ]"}
  .btn:hover{
    background:rgba(77,184,255,0.08);
    border-color:var(--fg);
    box-shadow:0 0 14px rgba(77,184,255,.25) inset;
  }
  .btn:active{transform:translateY(1px)}

  .copybtn{
    font:inherit;cursor:pointer;
    background:rgba(77,184,255,0.05);
    border:1px solid var(--line-bright);
    color:var(--fg);
    padding:7px 10px;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    transition:.15s;
    white-space:nowrap;
    text-shadow:var(--glow);
  }
  .copybtn::before{content:"> "}
  .copybtn:hover{
    border-color:var(--fg);
    color:var(--fg-bright);
    background:rgba(77,184,255,0.15);
    box-shadow:0 0 12px rgba(77,184,255,.3);
  }
  .copybtn:active{transform:translateY(1px)}

  .status{
    position:fixed;left:50%;bottom:50px;
    transform:translate(-50%,18px);
    background:rgba(3,10,20,0.95);
    border:1px solid var(--fg);
    color:var(--fg);
    padding:8px 18px;
    font-size:11px;
    letter-spacing:.15em;
    text-transform:uppercase;
    text-shadow:var(--glow);
    opacity:0;pointer-events:none;
    transition:.22s ease;
    z-index:60;
    max-width:90vw;text-align:center;
    box-shadow:0 0 20px rgba(77,184,255,.25);
  }
  .status.show{opacity:1;transform:translate(-50%,0)}
  .status.error{
    border-color:var(--err);color:var(--err);
    text-shadow:0 0 6px rgba(255,68,102,.7);
    box-shadow:0 0 20px rgba(255,68,102,.25);
  }

  .closed{
    display:none;
    flex:1;
    align-items:center;justify-content:center;
    flex-direction:column;
    gap:16px;
    padding:24px;
    text-align:center;
  }
  .closed.show{display:flex}
  .closed .msg{
    color:var(--fg-dim);
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:11px;
  }

  footer{
    text-align:center;
    padding:10px 16px 12px;
    font-size:10px;
    color:var(--fg-dim);
    letter-spacing:.18em;
    text-transform:uppercase;
    border-top:1px solid var(--line);
    background:rgba(3,10,20,0.6);
    text-shadow:none;
  }
  footer .brand{
    color:var(--fg);
    text-shadow:var(--glow);
    letter-spacing:.22em;
  }

  .modal-bg{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,5,12,0.75);
    z-index:70;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{
    width:100%;max-width:380px;
    background:rgba(8,20,36,0.98);
    border:1px solid var(--line-bright);
    box-shadow:0 0 40px rgba(77,184,255,.25);
    padding:22px 22px 18px;
  }
  .modal h2{
    margin:0 0 12px;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--fg-bright);
    text-shadow:var(--glow);
  }
  .modal p{
    margin:0 0 6px;
    font-size:12px;
    color:var(--fg);
    letter-spacing:.04em;
  }
  .modal .dim{color:var(--fg-dim);font-size:11px;letter-spacing:.08em}
  .modal .close{
    margin-top:16px;
    width:100%;
    font:inherit;cursor:pointer;
    background:transparent;
    border:1px solid var(--line-bright);
    color:var(--fg);
    padding:8px 10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    transition:.15s;
  }
  .modal .close:hover{
    background:rgba(77,184,255,.1);
    border-color:var(--fg);
  }
</style>
</head>
<body>

<div class="menubar">
  <span class="brand">Z1MCIPHOR</span>

  <div class="menu" id="fileMenu">
    <button type="button" data-toggle="fileMenu">File</button>
    <div class="dropdown">
      <button type="button" id="miMinimize">Minimize</button>
      <button type="button" id="miClose">Close</button>
    </div>
  </div>

  <div class="menu" id="helpMenu">
    <button type="button" data-toggle="helpMenu">Help</button>
    <div class="dropdown">
      <button type="button" id="miAbout">About</button>
    </div>
  </div>

  <div id="clock"><span class="t" id="clockTime">--:--:--</span></div>
</div>

<div class="main-wrap" id="mainWrap">
  <div class="header">
    <h1>Z1MCIPHOR</h1>
    <p class="sub">// symmetric text encipherment</p>
  </div>

  <div class="cols">
    <section class="panel">
      <div class="ptitle">
        <span>// encrypt</span>
        <span class="tag" id="encTag">input</span>
      </div>
      <div class="pbody">
        <textarea id="encBox" placeholder="> type message to encrypt..."></textarea>
        <div class="btnrow">
          <button id="encBtn" class="btn" type="button">encrypt →</button>
          <button class="copybtn" type="button" data-copy="encBox">copy</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="ptitle">
        <span>// decrypt</span>
        <span class="tag" id="decTag">input</span>
      </div>
      <div class="pbody">
        <textarea id="decBox" readonly></textarea>
        <div class="btnrow">
          <button id="decBtn" class="btn" type="button">decrypt →</button>
          <button class="copybtn" type="button" data-copy="decBox">copy</button>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="closed" id="closedScreen">
  <div class="msg">// application closed</div>
  <button id="reopenBtn" class="btn" type="button" style="max-width:220px">reopen</button>
</div>

<footer>Powered by <span class="brand">Z Solutions</span></footer>

<div class="modal-bg" id="aboutModal">
  <div class="modal">
    <h2>About</h2>
    <p>Z1MCIPHOR</p>
    <p class="dim">by Louis Zimmer</p>
    <p class="dim">Z Solutions</p>
    <button class="close" id="aboutClose" type="button">close</button>
  </div>
</div>

<div id="status" class="status"></div>

<script>
  const KEY = "0999666555";
  const NONCE_LEN = 16;

  const $ = (id) => document.getElementById(id);
  let statusTimer = null;

  function pad(n){ return String(n).padStart(2, "0"); }
  function tickClock(){
    const d = new Date();
    $("clockTime").textContent =
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);

  function toast(msg, isError) {
    const el = $("status");
    el.textContent = msg;
    el.className = "status show" + (isError ? " error" : "");
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => el.classList.remove("show"), 2500);
  }

  function closeAllMenus() {
    document.querySelectorAll(".menu").forEach((m) => m.classList.remove("open"));
  }

  document.querySelectorAll("[data-toggle]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.toggle;
      const menu = $(id);
      const wasOpen = menu.classList.contains("open");
      closeAllMenus();
      if (!wasOpen) menu.classList.add("open");
    });
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest || !e.target.closest(".menu")) {
      closeAllMenus();
    }
  }, true);

  $("miMinimize").addEventListener("click", () => {
    closeAllMenus();
    const wrap = $("mainWrap");
    const hidden = wrap.classList.toggle("minimized");
    toast(hidden ? "minimized — File > Minimize to restore" : "restored");
  });

  $("miClose").addEventListener("click", () => {
    closeAllMenus();
    $("mainWrap").style.display = "none";
    $("closedScreen").classList.add("show");
    toast("closed");
  });

  $("reopenBtn").addEventListener("click", () => {
    $("closedScreen").classList.remove("show");
    $("mainWrap").style.display = "";
    $("mainWrap").classList.remove("minimized");
    toast("reopened");
  });

  $("miAbout").addEventListener("click", () => {
    closeAllMenus();
    $("aboutModal").classList.add("show");
  });
  $("aboutClose").addEventListener("click", () => {
    $("aboutModal").classList.remove("show");
  });
  $("aboutModal").addEventListener("click", (e) => {
    if (e.target === $("aboutModal")) $("aboutModal").classList.remove("show");
  });

  async function sha256(bytes) {
    return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
  }

  async function keystream(keyBytes, nonce, length) {
    const out = new Uint8Array(length);
    let counter = 0, offset = 0;
    while (offset < length) {
      const block = new Uint8Array(keyBytes.length + nonce.length + 8);
      block.set(keyBytes, 0);
      block.set(nonce, keyBytes.length);
      new DataView(block.buffer).setBigUint64(
        keyBytes.length + nonce.length, BigInt(counter), false
      );
      const hash = await sha256(block);
      const take = Math.min(hash.length, length - offset);
      out.set(hash.subarray(0, take), offset);
      offset += take;
      counter++;
    }
    return out;
  }

  function b64urlEncode(bytes) {
    let bin = "";
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function b64urlDecode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function encryptText(plaintext, key) {
    const enc = new TextEncoder();
    const keyBytes = await sha256(enc.encode(key));
    const data = enc.encode(plaintext);
    const nonce = crypto.getRandomValues(new Uint8Array(NONCE_LEN));
    const stream = await keystream(keyBytes, nonce, data.length);
    const cipher = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i++) cipher[i] = data[i] ^ stream[i];
    const blob = new Uint8Array(NONCE_LEN + cipher.length);
    blob.set(nonce, 0);
    blob.set(cipher, NONCE_LEN);
    return b64urlEncode(blob);
  }

  async function decryptText(token, key) {
    const enc = new TextEncoder();
    const keyBytes = await sha256(enc.encode(key));
    const raw = b64urlDecode(token.replace(/\s+/g, ""));
    if (raw.length < NONCE_LEN) throw new Error("ciphertext too short");
    const nonce = raw.slice(0, NONCE_LEN);
    const cipher = raw.slice(NONCE_LEN);
    const stream = await keystream(keyBytes, nonce, cipher.length);
    const data = new Uint8Array(cipher.length);
    for (let i = 0; i < cipher.length; i++) data[i] = cipher[i] ^ stream[i];
    return new TextDecoder().decode(data);
  }

  function markOut(boxId, tagId) {
    $(boxId).classList.add("out");
    $(boxId).readOnly = true;
    $(tagId).textContent = "output";
    $(tagId).classList.add("out");
  }

  function markIn(boxId, tagId) {
    $(boxId).classList.remove("out");
    $(boxId).readOnly = false;
    $(tagId).textContent = "input";
    $(tagId).classList.remove("out");
  }

  $("encBtn").addEventListener("click", async () => {
    const box = $("encBox");
    if (box.readOnly) {
      box.value = "";
      markIn("encBox", "encTag");
      box.placeholder = "> type message to encrypt...";
      box.focus();
      return;
    }
    const message = box.value;
    if (!message.trim()) return toast("nothing to encrypt", true);
    try {
      box.value = await encryptText(message, KEY);
      markOut("encBox", "encTag");
      toast("encrypted");
    } catch (e) { toast("encryption failed", true); }
  });

  $("decBtn").addEventListener("click", async () => {
    const src = $("encBox");
    const dest = $("decBox");

    if (!src.readOnly || !src.value.trim()) {
      return toast("encrypt a message first", true);
    }

    try {
      const plain = await decryptText(src.value, KEY);
      dest.value = plain;
      markOut("decBox", "decTag");
      toast("decrypted");
    } catch (e) {
      dest.value = "";
      markIn("decBox", "decTag");
      toast("decryption failed", true);
    }
  });

  $("encBox").addEventListener("click", () => {
    const box = $("encBox");
    if (box.readOnly) {
      box.value = "";
      markIn("encBox", "encTag");
      box.placeholder = "> type message to encrypt...";
    }
  });

  document.querySelectorAll("[data-copy]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const v = $(btn.dataset.copy).value;
      if (!v) return toast("nothing to copy", true);
      try {
        await navigator.clipboard.writeText(v);
        toast("copied");
      } catch (_) {
        $(btn.dataset.copy).select();
        document.execCommand("copy");
        toast("copied");
      }
    });
  });

  $("encBox").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") $("encBtn").click();
  });
</script>
</body>
</html>
